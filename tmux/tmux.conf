# === 核心习惯：前缀键与鼠标 ===
# Changing the prefix key
# 将前缀键从默认的 Ctrl+b 改为 Ctrl+a（更顺手，且兼容 screen 习惯）
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# 开启鼠标支持（点击切换窗格、拖拽调整大小、滚轮查看历史）
# Mouse scrolling
set -g mouse on


# === 索引优化：窗口与窗格编号从 1 开始 ===
# 窗口和窗格编号从 1 开始，更符合直觉
# Window index starts from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# 关闭窗口后自动重排编号，避免序列出现空洞
set -g renumber-windows on


# === Statue line style setting ===

# Status bar color
set -g status-style bg=black,fg=white

# Left show session name
set -g status-left "#[fg=green,bold] [#S] "

# Right show time
# set -g status-right "#(date '+%Y-%m-%d %H:%M')"
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"

# Status line window style
setw -g window-status-separator "  "  # 窗口之间加空格，更宽松

# None current window
setw -g window-status-format "#[fg=colour244,bg=black] #I #W "

# Current window(highlight)
setw -g window-status-current-format "#[fg=white,bg=red,bold] #I #W "


# === 分屏快捷键：用更直观的符号代替 % 和 " ===
# 用 | 进行垂直分屏（左右），用 - 进行水平分屏（上下）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# More friendly split pane
# bind-key h split-window -h
# bind-key v split-window -v


# 按 前缀键 + r 重新加载配置
# Quickly reload the config file
# bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"


# Window Navigation
# Use 'option' in MacOS, and you need set Meta first
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# Enable 256 color support
# set -g default-terminal "screen-256color"
# If using fish/zsh shell etc, recommanding set to:
set -g default-terminal "tmux-256color"


# 加大回滚缓冲区，方便查看更早的输出
set -g history-limit 20000
